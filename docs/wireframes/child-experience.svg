<text x="870" y="741.5" font-size="18" font-weight="700" style="fill:#173F35">Bantu aku</text>
<rect x="1103" y="703" width="413" height="63" rx="14" fill="#126E60" stroke="#126E60" stroke-width="1"/>
<text x="1121" y="741.5" font-size="18" font-weight="700" style="fill:#FFFFFF">Ini jawabanku</text>
<text x="40" y="871" font-size="25" font-weight="700" style="fill:#173F35">Pendamping menyiapkan sesi; anak menjalankan petualangan</text>
<text x="40" y="914" font-size="18" font-weight="400" style="fill:#173F35">Beranda: satu tombol besar untuk mulai atau lanjut.</text>
<text x="40" y="945" font-size="18" font-weight="400" style="fill:#173F35">Peta dan koleksi membantu melihat perjalanan.</text>
<text x="40" y="976" font-size="18" font-weight="400" style="fill:#173F35">Setelah misi selesai, ajak kembali di lain waktu.</text>
<text x="820" y="914" font-size="18" font-weight="400" style="fill:#526C63">Aktivitas: satu tujuan, objek jelas, audio dapat diulang.</text>
<text x="820" y="945" font-size="18" font-weight="400" style="fill:#526C63">Dengar lagi berbeda dari petunjuk Bantu aku.</text>
<text x="820" y="976" font-size="18" font-weight="400" style="fill:#526C63">Ketuk tetap tersedia; penilaian dilakukan server.</text>
