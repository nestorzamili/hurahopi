<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">Hurahopi: sketsa beranda anak dan aktivitas</title><desc id="desc">Dua wireframe dunia Hopi dan satu aktivitas memilih tiga apel. Ilustrasi Hopi berupa placeholder. Tidak ada pembelian atau statistik penilaian pada layar anak.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173F35}.muted{fill:#526C63}.white{fill:#fff}</style><rect width="1600" height="1080" fill="#F6F5EF"/>
<text x="40" y="52" font-size="16" font-weight="700" style="fill:#126E60">PENGALAMAN UTAMA ANAK</text>
<text x="40" y="98" font-size="34" font-weight="700" style="fill:#173F35">Masuk ke dunia Hopi, lalu fokus pada satu aktivitas</text>
<text x="40" y="130" font-size="17" font-weight="400" style="fill:#526C63">Sketsa susunan layar • ilustrasi karakter berupa placeholder • bukan desain visual final</text>
