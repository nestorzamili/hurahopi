<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">Hurahopi: sketsa beranda orang tua</title><desc id="desc">Wireframe desktop dan ponsel. Semua angka dan nama adalah data sintetis. Fokus pada pemilih anak, memulai belajar, bukti perkembangan, saran dan karya.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173F35}.muted{fill:#526C63}.white{fill:#fff}</style><rect width="1600" height="1080" fill="#F6F5EF"/>
<text x="40" y="52" font-size="16" font-weight="700" style="fill:#126E60">AREA ORANG TUA</text>
<text x="40" y="98" font-size="34" font-weight="700" style="fill:#173F35">Ringkasan keluarga yang membantu mendampingi belajar</text>
<text x="40" y="130" font-size="17" font-weight="400" style="fill:#526C63">Sketsa susunan layar • data sintetis • bukan desain visual final</text>
<rect x="40" y="162" width="1060" height="650" rx="24" fill="#FFFFFF" stroke="#DCE4DA" stroke-width="1"/>
<text x="64" y="197" font-size="13" font-weight="700" style="fill:#526C63">DESKTOP / TABLET LEBAR</text>
<rect x="58" y="216" width="1024" height="74" rx="14" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1"/>
<text x="82" y="261" font-size="27" font-weight="700" style="fill:#126E60">hurahopi</text>
<rect x="322" y="231" width="204" height="46" rx="12" fill="#FFFFFF" stroke="#DCE4DA" stroke-width="1"/>
<text x="338" y="260" font-size="18" font-weight="700" style="fill:#173F35">Anak: Alya  v</text>
<text x="889" y="259" font-size="15" font-weight="400" style="fill:#173F35">Akun orang tua</text>
<rect x="58" y="308" width="173" height="480" rx="12" fill="#F5F8F2" stroke="#F5F8F2" stroke-width="1"/>
<rect x="70" y="326" width="150" height="44" rx="10" fill="#DEEEE4" stroke="#DEEEE4" stroke-width="1"/>
<text x="85" y="354" font-size="16" font-weight="700" style="fill:#173F35">Beranda</text>
<text x="85" y="409" font-size="16" font-weight="400" style="fill:#173F35">Perkembangan</text>
<text x="85" y="464" font-size="16" font-weight="400" style="fill:#173F35">Karya</text>
<text x="85" y="519" font-size="16" font-weight="400" style="fill:#173F35">Keluarga</text>
<text x="85" y="574" font-size="16" font-weight="400" style="fill:#173F35">Langganan</text>
<text x="85" y="756" font-size="15" font-weight="400" style="fill:#526C63">Pengaturan</text>
<text x="255" y="328" font-size="25" font-weight="700" style="fill:#173F35">Perjalanan belajar Alya</text>
<rect x="255" y="348" width="800" height="103" rx="16" fill="#EEF6E9" stroke="#EEF6E9" stroke-width="1"/>
<text x="276" y="381" font-size="20" font-weight="700" style="fill:#173F35">Misi hari ini: Mengenal jumlah</text>
<text x="276" y="410" font-size="15" font-weight="400" style="fill:#526C63">Sekitar 5 menit • siapkan perangkat, lalu serahkan ke Alya</text>
<rect x="848" y="373" width="184" height="52" rx="14" fill="#126E60" stroke="#126E60" stroke-width="1"/>
<text x="866" y="406.0" font-size="18" font-weight="700" style="fill:#FFFFFF">Mulai belajar</text>
<rect x="255" y="469" width="254" height="92" rx="13" fill="#FFFFFF" stroke="#DCE4DA" stroke-width="1"/>
<text x="272" y="498" font-size="14" font-weight="400" style="fill:#526C63">Hari belajar</text>
<text x="272" y="533" font-size="19" font-weight="700" style="fill:#173F35">3 hari minggu ini</text>
<rect x="528" y="469" width="254" height="92" rx="13" fill="#FFFFFF" stroke="#DCE4DA" stroke-width="1"/>
<text x="545" y="498" font-size="14" font-weight="400" style="fill:#526C63">Aktivitas tersimpan</text>
<text x="545" y="533" font-size="19" font-weight="700" style="fill:#173F35">12 aktivitas</text>
<rect x="801" y="469" width="254" height="92" rx="13" fill="#FFFFFF" stroke="#DCE4DA" stroke-width="1"/>
<text x="818" y="498" font-size="14" font-weight="400" style="fill:#526C63">Fokus latihan</text>
<text x="818" y="533" font-size="19" font-weight="700" style="fill:#173F35">Membilang 1–5</text>
<rect x="255" y="579" width="389" height="150" rx="14" fill="#FFFFFF" stroke="#DCE4DA" stroke-width="1"/>
<text x="274" y="610" font-size="20" font-weight="700" style="fill:#173F35">Perkembangan singkat</text>
<text x="274" y="641" font-size="15" font-weight="400" style="fill:#526C63">Alya mencoba dua jenis aktivitas.</text>
<text x="274" y="664" font-size="15" font-weight="400" style="fill:#526C63">Buka bukti untuk melihat bantuan</text>
<text x="274" y="687" font-size="15" font-weight="400" style="fill:#526C63">dan hasil yang teramati.</text>
<text x="274" y="714" font-size="14" font-weight="700" style="fill:#126E60">Lihat perkembangan dan bukti  &gt;</text>
<rect x="665" y="579" width="390" height="150" rx="14" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1"/>
<text x="684" y="610" font-size="20" font-weight="700" style="fill:#173F35">Coba bersama di rumah</text>
<text x="684" y="644" font-size="17" font-weight="400" style="fill:#173F35">Ajak Alya menghitung sendok</text>
<text x="684" y="672" font-size="17" font-weight="400" style="fill:#173F35">saat menyiapkan makan.</text>
<rect x="255" y="745" width="800" height="42" rx="10" fill="#F5F8F2" stroke="#F5F8F2" stroke-width="1"/>
<text x="274" y="772" font-size="16" font-weight="400" style="fill:#173F35">Karya dan kegiatan terbaru  •  lihat yang diizinkan</text>
<rect x="1130" y="162" width="430" height="650" rx="28" fill="#E4EAE2" stroke="#E4EAE2" stroke-width="1"/>
<rect x="1142" y="174" width="406" height="626" rx="22" fill="#FFFFFF" stroke="#DCE4DA" stroke-width="1"/>
<text x="1163" y="207" font-size="13" font-weight="700" style="fill:#526C63">PONSEL ORANG TUA</text>
<text x="1163" y="246" font-size="24" font-weight="700" style="fill:#126E60">hurahopi</text>
<rect x="1163" y="264" width="364" height="45" rx="12" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1"/>
<text x="1179" y="293" font-size="17" font-weight="700" style="fill:#173F35">Anak yang dipilih: Alya  v</text>
<text x="1163" y="344" font-size="24" font-weight="700" style="fill:#173F35">Perjalanan Alya</text>
<rect x="1163" y="363" width="364" height="133" rx="14" fill="#EEF6E9" stroke="#EEF6E9" stroke-width="1"/>
<text x="1180" y="394" font-size="19" font-weight="700" style="fill:#173F35">Misi hari ini</text>
<text x="1180" y="421" font-size="14" font-weight="400" style="fill:#526C63">Mengenal jumlah • sekitar 5 menit</text>
<rect x="1180" y="435" width="328" height="45" rx="14" fill="#126E60" stroke="#126E60" stroke-width="1"/>
<text x="1198" y="464.5" font-size="18" font-weight="700" style="fill:#FFFFFF">Mulai belajar</text>
<rect x="1163" y="512" width="364" height="76" rx="12" fill="#FFFFFF" stroke="#DCE4DA" stroke-width="1"/>
<text x="1180" y="541" font-size="17" font-weight="700" style="fill:#173F35">3 hari belajar  •  12 aktivitas</text>
<text x="1180" y="567" font-size="15" font-weight="400" style="fill:#526C63">Fokus: membilang 1–5</text>
<rect x="1163" y="602" width="364" height="112" rx="12" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="1"/>
<text x="1180" y="631" font-size="18" font-weight="700" style="fill:#173F35">Saran pendampingan</text>
<text x="1180" y="658" font-size="15" font-weight="400" style="fill:#173F35">Hitung sendok bersama saat</text>
<text x="1180" y="681" font-size="15" font-weight="400" style="fill:#173F35">menyiapkan makan.</text>
<rect x="1155" y="738" width="380" height="49" rx="10" fill="#F0F5EC" stroke="#F0F5EC" stroke-width="1"/>
<text x="1167" y="768" font-size="11" font-weight="700" style="fill:#173F35">Beranda</text>
<text x="1252" y="768" font-size="11" font-weight="400" style="fill:#173F35">Perkembangan</text>
<text x="1390" y="768" font-size="11" font-weight="400" style="fill:#173F35">Karya</text>
<text x="1465" y="768" font-size="11" font-weight="400" style="fill:#173F35">Menu</text>
<text x="40" y="876" font-size="25" font-weight="700" style="fill:#173F35">Yang harus terasa jelas</text>
<text x="40" y="916" font-size="19" font-weight="400" style="fill:#173F35">1. Selalu tahu anak yang sedang dilihat.</text>
<text x="40" y="949" font-size="19" font-weight="400" style="fill:#173F35">2. Mulai belajar menjadi tindakan utama.</text>
<text x="40" y="982" font-size="19" font-weight="400" style="fill:#173F35">3. Ringkasan memiliki bukti dan saran yang bisa dilakukan.</text>
<text x="840" y="916" font-size="18" font-weight="400" style="fill:#526C63">Di ponsel: satu kolom, empat menu utama.</text>
<text x="840" y="949" font-size="18" font-weight="400" style="fill:#526C63">Pengasuh hanya melihat profil dan fitur yang diizinkan.</text>
<text x="840" y="982" font-size="18" font-weight="400" style="fill:#526C63">Laporan di ponsel tidak memindahkan sesi anak di tablet.</text>
</svg>
